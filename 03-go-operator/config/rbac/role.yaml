# RBAC 权限 — 由 controller-gen 从代码中的 +kubebuilder:rbac markers 自动生成
# 命令: controller-gen rbac:roleName=appservice-operator paths=./internal/controller output:rbac:artifacts:config=rbac
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appservice-operator
  namespace: default
  labels:
    app.kubernetes.io/part-of: appservice-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appservice-operator
  labels:
    app.kubernetes.io/part-of: appservice-operator
rules:
  # AppService 自定义资源的完整权限
  - apiGroups:
      - example.com
    resources:
      - appservices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # AppService Status 子资源权限
  - apiGroups:
      - example.com
    resources:
      - appservices/status
    verbs:
      - get
      - update
      - patch

  # AppService Finalizer 权限
  - apiGroups:
      - example.com
    resources:
      - appservices/finalizers
    verbs:
      - update

  # Deployment 权限（Operator 需要创建和管理 Deployment）
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Service 权限
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Event 权限（用于记录事件）
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: appservice-operator
  labels:
    app.kubernetes.io/part-of: appservice-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: appservice-operator
subjects:
  - kind: ServiceAccount
    name: appservice-operator
    namespace: default
