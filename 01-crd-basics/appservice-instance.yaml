# 示例 1：简单的 Nginx 应用
apiVersion: example.com/v1
kind: AppService
metadata:
  name: my-nginx
  labels:
    app: nginx
    env: demo
spec:
  image: nginx:latest
  replicas: 2
  port: 80

---
# 示例 2：带资源限制的应用
apiVersion: example.com/v1
kind: AppService
metadata:
  name: my-api
  labels:
    app: api
    env: demo
spec:
  image: nginx:alpine
  replicas: 3
  port: 8080
  resources:
    cpu: "100m"
    memory: "128Mi"
  env:
    - name: ENV
      value: production
    - name: LOG_LEVEL
      value: info

---
# 示例 3：带完整配置的应用
apiVersion: example.com/v1
kind: AppService
metadata:
  name: my-webapp
  labels:
    app: webapp
  annotations:
    description: "完整的示例应用"
spec:
  image: nginx:stable
  replicas: 2
  port: 3000
  resources:
    cpu: "200m"
    memory: "256Mi"
  env:
    - name: NODE_ENV
      value: production
    - name: API_URL
      value: "https://api.example.com"
