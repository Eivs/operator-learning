apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appservices.example.com
spec:
  # API 组名: example.com
  # 完整的 API 路径: /apis/example.com/v1/namespaces/{ns}/appservices
  group: example.com

  # 资源命名
  names:
    kind: AppService        # Kind（在 YAML 中使用）
    plural: appservices     # 复数（kubectl get appservices）
    singular: appservice    # 单数（kubectl get appservice）
    shortNames:
      - as                  # 短名（kubectl get as）
    # listKind 和 categories 是可选的
    listKind: AppServiceList
    categories:
      - all                 # 让 kubectl get all 也能显示

  # 作用域：Namespaced 或 Cluster
  scope: Namespaced

  # 版本定义
  versions:
    - name: v1
      served: true          # 启用此版本（API 可访问）
      storage: true         # 持久化存储版本（只能有一个版本 storage=true）

      # 字段校验（OpenAPI v3 Schema）
      schema:
        openAPIV3Schema:
          type: object
          description: AppService 代表一个简单的 Web 应用程序
          properties:
            # spec 定义"期望状态"
            spec:
              type: object
              description: AppService 的期望状态
              properties:
                image:
                  type: string
                  description: 容器镜像地址
                  example: nginx:latest
                replicas:
                  type: integer
                  description: Pod 副本数量
                  minimum: 1
                  default: 1
                port:
                  type: integer
                  description: 服务端口
                  minimum: 1
                  maximum: 65535
                  default: 80
                resources:
                  type: object
                  description: 资源配置
                  properties:
                    cpu:
                      type: string
                      description: CPU 请求量
                      pattern: '^[0-9]+m?$'
                    memory:
                      type: string
                      description: 内存请求量
                      pattern: '^[0-9]+(Mi|Gi)?$'
                env:
                  type: array
                  description: 环境变量列表
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                      - name
              required:
                - image
                - replicas

            # status 定义"当前状态"（由 Controller 写入）
            status:
              type: object
              description: AppService 的当前状态
              properties:
                availableReplicas:
                  type: integer
                  description: 可用的副本数
                conditions:
                  type: array
                  description: 状态条件
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                    required:
                      - type
                      - status

      # 子资源定义
      subresources:
        # 启用 status 子资源：spec 和 status 可以独立更新
        status: {}
        # 启用 scale 子资源：支持 kubectl scale
        # scale:
        #   specReplicasPath: .spec.replicas
        #   statusReplicasPath: .status.availableReplicas

      # 打印列（kubectl get 时的输出列）
      additionalPrinterColumns:
        - name: Image
          type: string
          description: 容器镜像
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          description: 期望副本数
          jsonPath: .spec.replicas
        - name: Port
          type: integer
          description: 服务端口
          jsonPath: .spec.port
        - name: Available
          type: integer
          description: 可用副本数
          jsonPath: .status.availableReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
